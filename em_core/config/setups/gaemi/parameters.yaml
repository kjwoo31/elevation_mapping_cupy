elevation_mapping_node:
  ros__parameters:
    #### 고도 지도 제작 파라미터 ########
    resolution: 0.05                                # m 단위 지도 해상도
    map_length: 3.0                                 # m 단위 지도 길이
    sensor_noise_factor: 0.05                       # sensor_noise_factor*(센서로부터 포인트의 거리)^2으로 포인트 오차를 계산한다.
    mahalanobis_thresh: 2.0                         # outlier를 판단하는 Mahalanobis distance 기준
    outlier_variance: 0.01                          # outlier일 경우, cell에 더하는 값
    drift_compensation_variance_inlier: 0.05        # 높이 오차 보정에 사용하는 분산값 기준 (아래값만 사용)
    max_drift: 0.1                                  # 최대 높이 오차 보정값
    drift_compensation_alpha: 0.1                   # (오차)*alpha만큼 높이 오차 보정을 진행한다. alpha를 줄여 부드러운 보정이 가능하다.
    time_variance: 0.0001                           # update_variance를 호출할 때마다 더하는 시간 분산값
    max_variance: 100.0                             # 각 셀의 최대 분산값
    initial_variance: 1000.0                        # 각 셀의 초기 분산값
    traversability_inlier: 0.9                      # 높이 오차 보정을 시작하는 traversability 기준
    dilation_size: 3.0                              # traversability filter 이전에 사용하는 dilation filter 크기
    wall_num_thresh: 20                             # 벽을 날카롭게 나타내기 위해 현재 높이 대신 최대 높이를 활용하는 포인트 개수 기준
    min_height_drift_count: 100                     # 높이 오차 보정을 시작하는 포인트 개수 기준
    position_noise_thresh: 0.01                     # 높이 오차 보정을 시작하는 위치 오차 기준
    orientation_noise_thresh: 0.01                  # 높이 오차 보정을 시작하는 회전 오차 기준
    position_lowpass_alpha: 0.2                     # 로봇 위치 오차 업데이트 계수
    orientation_lowpass_alpha: 0.2                  # 로봇 회전 오차 업데이트 계수
    min_valid_distance: 0.14                        # 로봇으로부터 거리가 짧은 포인트 필터링 범위
    max_height_range: 1.1                           # 포인트 최대 높이 범위. (천장 필터링)
    update_variance_fps: 5.0                        # 분산값 업데이트 fps
    update_pose_fps: 10.0                           # 로봇 및 지도 위치 업데이트 fps
    update_map_time_interval: 0.1                   # 시간 layer 업데이트 주기
    map_acquire_fps: 5.0                            # GPU 메모리에서 지도 업데이트 fps

    max_ray_length: 4.0                             # Ray tracing 최대 길이
    cleanup_step: 0.1                               # Ray tracing을 적용하는 길이 단위
    cleanup_cos_thresh: 0.1                         # Ray tracing을 적용하는 내적값 기준

    map_frame: 'odom'                               # odometry에서 사용하는 map frame
    base_frame: 'base_footprint'                    # 로봇 base frame. 이 frame이 지도 중심이다.

    use_manual_camera_info: true                    # Gemini2 카메라 정보 수동 입력 여부
    manual_camera_info: [612.443, 0.0, 628.497, 0.0, 612.443, 400.130, 0.0, 0.0, 1.0]
    max_valid_distance: 4.0                         # Depth 이미지 최대 허용 거리 범위

    enable_visibility_cleanup: true                 # Ray tracing 활성화
    enable_drift_compensation: true                 # 높이 오차 보정 활성화

    #### Traversability 필터 ########
    weight_file: '$(ros2 pkg prefix em_core)/share/em_core/config/core/weights.dat'

    #### 플러그인 ########
    plugin_config_file: '$(ros2 pkg prefix em_core)/share/em_core/config/setups/gaemi/plugin_config.yaml'

    #### Publishers ########
    publishers:
      # pub_list: ['elevation_map', 'height_thresh']  # launch 파일에 pub_list 매개변수를 설정하였다.
      elevation_map:
        layers: ['elevation']
        basic_layers: ['elevation']
        fps: 5.0
      height_thresh:
        layers: ['height_thresh']
        basic_layers: ['height_thresh']
        fps: 5.0

    #### Subscribers ########
    subscribers:
      sub_list: ['cliff_cam']
      scan:
        topic_name: '/scan_to_cloud'
        data_type: pointcloud
      cliff_cam:
        topic_name: '/cliff_gemini2/depth/image_raw'
        camera_info_topic_name: '/cliff_gemini2/depth/camera_info'
        data_type: depth
